<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Two</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto auto auto;
            gap: 10px;
            background-color: rgb(255, 255, 255);
            padding: 10px;
        }

        .nav {
            grid-column: 1 / -1;
            background-color: #f1f1f1;
            overflow: hidden;
        }

        .nav a {
            float: left;
            color: #000;
            text-align: center;
            padding: 14px 16px;
            font-size: 10px;
        }

        .feature {
            grid-column: 1 / -1;
            background-color: #f1f1f1;
            border: 10px solid white;
            padding: 40px 0px;
            font-size: 10px;
            text-align: left    ;
        }

        .body>div {
            background-color: #f1f1f1;
            border: 10px solid white;
            padding: 40px 0px;
            font-size: 10px;
            text-align: left;
        }

        .body {
            display: contents;
            margin: 0;
        }

        .footer {
            grid-column: 1 / -1;
            background-color: #f1f1f1;
            border: 10px solid white;
            padding: 20px 0px;
            font-size: 10px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>

        <div class="feature">
            Feature
        </div>

        <div class="body">
            <div>Column One</div>
            <div>Column Two</div>
            <div>Column Three</div>
        </div>

        <div class="footer">
            &copy; Copyright 2011
        </div>
    </div>
</body>

</html>
