<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Greeting & Color Changer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
            color: #333;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }

        label, input, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="text"], input[type="color"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="color"] {
            height: 50px;
            cursor: pointer;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }

        #greeting {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #dc3545;
        }
    </style>
  </head>
  <body>

    <div class="container">
      <h1>Customize Your Greeting</h1>

      <label for="userName">Enter your name:</label>
      <input type="text" id="userName" placeholder="e.g., Alex" required>

      <label for="bgColorPicker">Select a background color:</label>
      <input type="color" id="bgColorPicker" value="#f0f8ff"> <button
        id="actionButton">Greet Me & Change Color!</button>

      <p id="greeting"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('userName');
            const colorPicker = document.getElementById('bgColorPicker');
            const actionButton = document.getElementById('actionButton');
            const greetingElement = document.getElementById('greeting');
            const body = document.body;

            actionButton.addEventListener('click', () => {
                const name = nameInput.value.trim();
                const selectedColor = colorPicker.value;

                if (name === "") {
                    alert("Please enter your name!");
                    return;
                }

                body.style.backgroundColor = selectedColor;

                greetingElement.textContent = `Hello, ${name}! Your background is now "${selectedColor}".`;
            });
        });
    </script>

  </body>
</html>
