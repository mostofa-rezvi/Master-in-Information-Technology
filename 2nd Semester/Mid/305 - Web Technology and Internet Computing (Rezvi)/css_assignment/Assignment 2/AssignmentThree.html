<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assignment Three</title>
<style>
  body {
    margin: 0;
    background: white;
  }

  .grid-container {
    display: grid;
    height: 70vh;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: auto 1fr auto;
    gap: 10px;
    padding: 10px;

    grid-template-areas:
      "header header header header header header"
      "menu main main main main right"
      "footer footer footer footer footer footer";
  }

  .item1 {
    grid-area: header;
    background-color: green;
    border-radius: 20px;
    color: white;
    height: 10vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .item2 {
    grid-area: menu;
    background-color: #FF5722;
    border-radius: 10px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .item3 {
    grid-area: main;
    background-color: #9C27B0;
    border-radius: 10px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .item4 {
    grid-area: right;
    background-color: #FFC107;
    border-radius: 10px;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .item5 {
    grid-area: footer;
    background-color: blue;
    border-radius: 20px;
    color: white;
    display: flex;
    height: 10vh;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
</style>
</head>
<body>

<div class="grid-container">
  <div class="item1">Header</div>
  <div class="item2">Sidebar 1</div>
  <div class="item3">Normal Text</div>
  <div class="item4">Sidebar 2</div>
  <div class="item5">Footer</div>
</div>

</body>
</html>
